 y2="380" stroke="#71717A" stroke-width="1.5"/><polygon points="335.0,380 345.0,380 340.0,388" fill="#71717A"/><rect x="30" y="388" width="620" height="62" rx="12" fill="#111111" stroke="#F7C200" stroke-width="1.5"/><text x="54" y="414" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">External Services</text><text x="54" y="434" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#71717A">Authentication, payment APIs, email, webhooks, network integrations, background tasks</text>
